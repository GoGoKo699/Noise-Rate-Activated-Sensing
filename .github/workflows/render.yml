name: Hosted rendering
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'scripts/check_rendering.py'
      - '.github/workflows/render.yml'
permissions:
  contents: read
jobs:
  rendering:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.AUDIT_REF }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - run: python -m pip install 'playwright>=1.49,<2' 'Pillow>=10,<13'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check_rendering.py --ref "$AUDIT_REF" --output "$RUNNER_TEMP/nras-rendering" --log-previews
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: hosted-rendering
          path: ${{ runner.temp }}/nras-rendering
          retention-days: 14
